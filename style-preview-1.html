<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Estilo 1 — Divertido & Colorido</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #FF6B6B, #FFE66D, #4ECDC4); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { background: white; border-radius: 24px; padding: 40px; max-width: 520px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.15); }
  .tag { display: inline-block; background: #FF6B6B; color: white; font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; padding: 6px 14px; border-radius: 20px; margin-bottom: 20px; }
  h2 { font-size: 26px; font-weight: 800; color: #1a1a2e; margin-bottom: 8px; line-height: 1.3; }
  .subtitle { color: #888; font-size: 15px; margin-bottom: 32px; }
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .option { border: 2px solid #f0f0f0; border-radius: 16px; padding: 16px; cursor: pointer; transition: all 0.2s; text-align: center; }
  .option:hover { border-color: #FF6B6B; background: #fff5f5; transform: translateY(-2px); }
  .option .emoji { font-size: 28px; display: block; margin-bottom: 8px; }
  .option span { font-size: 14px; font-weight: 600; color: #333; }
  .progress { margin-top: 32px; }
  .progress-bar { height: 6px; background: #f0f0f0; border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; width: 40%; background: linear-gradient(90deg, #FF6B6B, #FFE66D); border-radius: 3px; }
  .progress-text { font-size: 13px; color: #aaa; margin-top: 8px; text-align: center; }
  .label { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); color: white; padding: 8px 20px; border-radius: 20px; font-size: 13px; font-weight: 700; }
</style>
</head>
<body>
<div class="label">🎨 ESTILO 1 — Divertido & Colorido</div>
<div class="card">
  <span class="tag">Pergunta 2 de 5</span>
  <h2>Qual é o seu fim de semana ideal?</h2>
  <p class="subtitle">Seja honesto — não existe resposta errada!</p>
  <div class="options">
    <div class="option">
      <span class="emoji">🏔️</span>
      <span>Aventura ao ar livre</span>
    </div>
    <div class="option">
      <span class="emoji">🛋️</span>
      <span>Netflix e relaxar</span>
    </div>
    <div class="option">
      <span class="emoji">🎉</span>
      <span>Sair com amigos</span>
    </div>
    <div class="option">
      <span class="emoji">📚</span>
      <span>Ler em silêncio</span>
    </div>
  </div>
  <div class="progress">
    <div class="progress-bar"><div class="progress-fill"></div></div>
    <p class="progress-text">40% concluído</p>
  </div>
</div>
</body>
</html>
